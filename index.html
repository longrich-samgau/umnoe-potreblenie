<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Покупки, которые работают на вас</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page hero-page">
  <img src="bg-01.png" alt="" class="hero-bg">
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="badge-row fade-in">
      <div class="badge-num">01</div>
      <div class="badge-label">Вопрос</div>
    </div>

    <h1 class="hero-h1 fade-in fade-in-delay-1">Вы всё равно покупаете это каждый месяц</h1>

    <div class="tag-row fade-in fade-in-delay-1">
      <span class="tag-chip">
        <span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4c2 0 3.5 1 5.5 1S13 4 16 4s5 2 5 5c0 4-2 6-2 9a3 3 0 0 1-6 0v-1a2 2 0 0 0-4 0v1a3 3 0 0 1-6 0c0-3-2-5-2-9 0-2 1-5 3-5z"/></svg></span>
        Зубная паста
      </span>
      <span class="tag-chip">
        <span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4v3.5l2 2V21a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V7.5l2-2z"/><path d="M8 12h8"/></svg></span>
        Шампунь
      </span>
      <span class="tag-chip">
        <span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c0-2 1.5-3 1.5-5A3.5 3.5 0 0 1 9 3.5c1 0 1.5.5 2.5.5S13 3 14 3a3 3 0 0 1 3 3c0 1-0.5 1.5-0.5 2.5 0 .8.5 1 .5 1.5H4z"/><path d="M4 12h13.5a2.5 2.5 0 0 1 2.5 2.5v3A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"/></svg></span>
        Мыло
      </span>
      <span class="tag-chip">
        <span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
        Средства для дома
      </span>
    </div>

    <p class="hero-text fade-in fade-in-delay-2">
      Они закончатся — вы купите их снова.<br>
      Один расход. Два результата.
    </p>

    <div class="hero-result fade-in fade-in-delay-2">
      <div class="hero-result-row"><span class="dot-bad">●</span> В одном случае — товар закончился, деньги ушли.</div>
      <div class="hero-result-row"><span class="dot-good">●</span> В другом — товар закончился, а часть денег вернулась.</div>
    </div>

    <a href="02.html" class="hero-btn fade-in fade-in-delay-2">Показать как это работает <span class="arrow">→</span></a>
  </div>
</div>
</body>
</html>
